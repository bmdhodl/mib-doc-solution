name: Public contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the locked runtime and pinned test tools
        run: |
          python -m pip install --no-deps --require-hashes -r requirements.lock
          python -m pip install jsonschema==4.25.1 pytest==8.4.2
      - name: Run the complete public test suite
        run: python -m pytest -q
      - name: Build the submitted image
        run: docker build --tag mib-public-contract .
      - name: Verify the fail-closed command-line contract
        shell: bash
        run: |
          set +e
          docker run --rm \
            --network none \
            --cpus 4 \
            --memory 8g \
            --pids-limit 512 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=1g \
            mib-public-contract
          status=$?
          set -e
          test "$status" -eq 64
